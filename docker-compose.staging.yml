services:
  postgres:
    image: postgres:16-alpine
    container_name: puntual_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puntual_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in staging}
      POSTGRES_DB: ${POSTGRES_DB:-puntual_staging}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puntual_staging} -d ${POSTGRES_DB:-puntual_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - puntual_staging_network

  redis:
    image: redis:7-alpine
    container_name: puntual_staging_redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-server --requirepass \"$${REDIS_PASSWORD}\"; else redis-server; fi"
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: >
        sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - puntual_staging_network

volumes:
  postgres_staging_data:
    name: puntual_postgres_staging_data
  redis_staging_data:
    name: puntual_redis_staging_data

networks:
  puntual_staging_network:
    name: puntual_staging_network
