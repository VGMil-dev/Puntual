version: '3.9'

services:
  puntual-postgres:
    image: postgres:16-alpine
    container_name: puntual-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puntual_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-puntual_staging}
    volumes:
      - puntual_staging_postgres_data:/var/lib/postgresql/data
    networks:
      - puntual-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puntual_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  puntual-redis:
    image: redis:7-alpine
    container_name: puntual-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - puntual_staging_redis_data:/data
    networks:
      - puntual-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  puntual-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: puntual-staging-api
    restart: unless-stopped
    depends_on:
      puntual-postgres:
        condition: service_healthy
      puntual-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: staging
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-puntual_staging}:${POSTGRES_PASSWORD}@puntual-postgres:5432/${POSTGRES_DB:-puntual_staging}?schema=public
      REDIS_URL: redis://puntual-redis:6379
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - puntual-staging-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  puntual_staging_postgres_data:
    name: puntual_staging_postgres_data
  puntual_staging_redis_data:
    name: puntual_staging_redis_data

networks:
  puntual-staging-net:
    name: puntual-staging-net
    driver: bridge
